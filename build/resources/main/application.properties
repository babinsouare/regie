# --- Notifications ---
# Heure du balayage quotidien des regles planifiees (rappels d'echeance, debut/fin de campagne).
ogp.notifications.cron=0 0 8 * * *
# Coordonnees de service utilisees par les regles dont le destinataire est "interne".
ogp.notifications.interne.email=notifications@ogp.gn
ogp.notifications.interne.msisdn=

# --- Rattrapage des paiements Soutra ---
# Reprise des paiements restes en attente lorsque le callback n'est pas parvenu.
ogp.soutra.rattrapage.cron=0 0/5 * * * *
# Age minimal d'un paiement avant de solliciter Soutra (laisse au callback le temps d'arriver).
ogp.soutra.rattrapage.delai-minutes=10
# Au-dela de cet age, le paiement est abandonne et cesse d'etre interroge.
ogp.soutra.rattrapage.expiration-heures=24

# --- Avancement automatique des campagnes ---
# Bascule paied -> ongoing a la date de debut, puis ongoing -> ended apres la date de fin.
ogp.campagnes.transition.cron=0 15 0 * * *
