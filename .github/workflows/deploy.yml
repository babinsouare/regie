name: Deploy Regie API

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t babinsouare/regie-api:latest .

      - name: Push image
        run: docker push babinsouare/regie-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: babin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy/app-regie
            docker pull babinsouare/regie-api:latest
            docker compose down
            docker compose up -d